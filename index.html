<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beer Date?</title>

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#ffe8b6);
    font-family:Arial,sans-serif;
}

.card{
    background:white;
    width:90%;
    max-width:500px;
    padding:30px;
    border-radius:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    color:#ff5e8a;
    margin-bottom:10px;
}

p{
    color:#666;
    font-size:18px;
}

.buttons{
    margin-top:30px;
    position:relative;
    height:250px;
}

button{
    border:none;
    border-radius:999px;
    padding:16px 30px;
    font-size:20px;
    cursor:pointer;
    transition:.25s;
}

#yesBtn{
    background:#ff5e8a;
    color:white;
    font-weight:bold;
}

#yesBtn:hover{
    transform:scale(1.05);
}

#noBtn{
    background:#f2f2f2;
    color:#555;
    position:absolute;
}

.success{
    animation:pop .5s ease;
}

@keyframes pop{
    from{
        transform:scale(.7);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}
</style>
</head>
<body>

<div class="card" id="card">

<h1>🍺 One Tiny Question...</h1>

<p id="message">
Would you like to drink a few beers with Ace?
</p>

<div class="buttons">

<button id="yesBtn">YES! 🍻</button>

<button id="noBtn">No</button>

</div>

</div>

<script>

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const msg = document.getElementById("message");

const texts = [
"Are you sure? 🥺",
"Really sure? 😭",
"Think again... 🍺",
"The beers are getting sad 😔",
"Come on, it'll be fun 😏",
"Last chance 👀",
"You're breaking my heart 💔",
"Okay now you're just being mean 😂",
"Fine... but what if I buy the first round? 🍻",
"NO IS NOT AN OPTION 😈"
];

let count = 0;
let yesScale = 1;

function moveNoButton(){

    const maxX = window.innerWidth - noBtn.offsetWidth - 30;
    const maxY = window.innerHeight - noBtn.offsetHeight - 30;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    msg.textContent = texts[Math.min(count,texts.length-1)];

    count++;

    yesScale += 0.15;
    yesBtn.style.transform = `scale(${yesScale})`;
}

noBtn.addEventListener("mouseover", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);

yesBtn.addEventListener("click", () => {

document.body.innerHTML = `
<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e7,#ffe8b6);
font-family:Arial,sans-serif;
text-align:center;
">

<div class="success">

<h1 style="font-size:60px;">
🍻💖
</h1>

<h1 style="color:#ff5e8a;">
YAY!!!
</h1>

<p style="font-size:24px;">
Beer date confirmed 😎
</p>

<p>
I'll start chilling the beers 🍺
</p>

</div>

</div>
`;
});

moveNoButton();

</script>

</body>
</html>
